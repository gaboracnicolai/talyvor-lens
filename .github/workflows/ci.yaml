name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway Postgres for two standing regression guards:
    # (1) the LENS_TEST_DATABASE_URL-gated integration tests (pool-mint-cap
    #     exactness + dbmigrate runner) — they create their own schema/fixtures
    #     and touch disjoint tables, no migration step needed;
    # (2) the real-migration guard below, which applies migrations/*.sql via
    #     `lens migrate` into its OWN database (lens_migrate_check — the gated
    #     tests DROP/CREATE their fixture tables, so they must not share a DB
    #     with a fully-migrated schema) and then re-runs to prove the chain is
    #     version-tracked idempotent. pgvector image, not plain postgres:
    #     0001_init.sql needs CREATE EXTENSION vector — same image production
    #     compose uses.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: lens_test
          POSTGRES_DB: lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: false
      - name: go vet
        run: go vet ./...
      # Real-migration regression guard: the ONLY place migrations/*.sql are
      # executed in automation (the gated tests build their own fixtures, the
      # dbmigrate integration test uses synthetic MapFS files). Run 1 applies
      # 0001→0049 from a clean database; run 2 must be a version-tracked
      # no-op. This is the guard that would have caught the 0037
      # DROP-INDEX-CONCURRENTLY-on-partitioned-index deploy blocker (#125)
      # and the 0001 re-run failure (#127) at PR time.
      - name: real migrations apply + re-run no-op
        env:
          PGPASSWORD: lens_test
          LENS_DATABASE_URL: postgres://postgres:lens_test@localhost:5432/lens_migrate_check?sslmode=disable
        run: |
          psql -h localhost -U postgres -d lens_test -c 'CREATE DATABASE lens_migrate_check'
          go run ./cmd/lens migrate
          go run ./cmd/lens migrate 2>&1 | tee /tmp/migrate-rerun.log
          grep -q "already up to date" /tmp/migrate-rerun.log
          want="$(ls migrations/*.sql | wc -l | tr -d ' ')"
          got="$(psql -h localhost -U postgres -d lens_migrate_check -tAc 'SELECT count(*) FROM schema_migrations')"
          echo "schema_migrations: got=$got want=$want"
          test "$got" = "$want"
      - name: go test
        env:
          LENS_TEST_DATABASE_URL: postgres://postgres:lens_test@localhost:5432/lens_test?sslmode=disable
        # -p 1 serialises package test binaries so they never share the single lens_test DB concurrently.
        # Without it, packages run in parallel against one DB and destructive resets collide intermittently
        # — e.g. internal/proxy TestAgentAllocator's `TRUNCATE ... lxc_ledger` (blocked by the U14
        # append-only trigger once a concurrent package has migrated it) and internal/api
        # TestSpendByRequest's token_events seed — producing false reds on unrelated PRs (this caused #276's
        # scary-but-harmless red). Serialising is the systemic fix; correctness over a little wall-clock.
        run: go test -timeout 120s -race -count=1 -p 1 ./...

  # Formal static-analysis gate: golangci-lint (errcheck, govet, ineffassign,
  # staticcheck, unused). Config in .golangci.yml. Blocking — a finding fails the
  # build. (go vet also runs in the test job; pinned here under the lint suite too.)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Must EQUAL go.mod's `toolchain` (go1.26.6): golangci-lint refuses to run if it
          # was built with a Go older than the module's targeted version. (The test/build
          # jobs can stay on 1.25 — `go test`/`go build` auto-fetch the toolchain; a
          # `go install`-built golangci-lint does not, so it needs the newer Go here.)
          # ">=" was the old wording and it is too weak to be checkable: go.mod's toolchain
          # is a FLOOR, so a pin ABOVE it is not pulled back down. internal/toolchainaudit
          # asserts equality — change this and go.mod together or the guard reds.
          go-version: "1.26.6"
          cache: false
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # Supply-chain gate: govulncheck against the Go vulnerability DB. This is the
  # standing guard for the unmaintained-but-sandboxed github.com/ledongthuc/pdf
  # dependency (see internal/distill/pdf.go): a future CVE in it — or any dep, or
  # the stdlib — fails the build so we ACT on it, rather than silently carrying a
  # vulnerable parser of attacker-controlled input. govulncheck is
  # reachability-aware (reports only vulns on code paths the binary actually
  # calls), so it stays low-noise: a require-only/unreachable vuln does not fail.
  # Tool pinned; the vuln DB is fetched fresh at scan time.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6" # keep in lockstep with go.mod toolchain so stdlib vulns are assessed against the shipped runtime — ENFORCED by internal/toolchainaudit, because a pin ABOVE go.mod's toolchain grades a stdlib nothing ships and this gate would go green over a vulnerable binary
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: false
      - name: Build binary
        run: |
          VERSION="$(git rev-parse --short HEAD)"
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags="-w -s -X main.lensVersion=${VERSION}" \
            -o bin/lens ./cmd/lens
          # THE GATE FOR THIS CLASS. A version constant that nothing sets looks
          # exactly like information while carrying none — the same shape as a
          # guard that never runs. A unit test cannot see whether the link step
          # happened, so the check belongs here, against the built artifact:
          # drop the -X flag and this fails.
          got="$(./bin/lens version)"
          echo "built binary reports: ${got}"
          if [ "${got}" = "dev" ]; then
            echo "::error::the release binary reports the unstamped placeholder — -X main.lensVersion was not applied"
            exit 1
          fi
          test "${got}" = "${VERSION}"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lens-binary
          path: bin/lens
